#
# Relocated from boat-platform/.github/workflows/, where GitHub Actions never
# saw it. Workflows are only discovered at the repository root.
#
# Triggers on a v*.*.* tag. It ran for v0.1.0 and v0.1.1, but was restructured
# after them (issue #51: native amd64 + arm64 builds via portable-build.yml), so
# the current shape has not run on a tag yet -- push a pre-release tag first and
# check every job before tagging a real release.

name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  portable-build:
    # Native amd64 + arm64 builds in the AlmaLinux 8 baseline image, packaged.
    # Packages and image ship the very binaries this produced and tested.
    uses: ./.github/workflows/portable-build.yml
    with:
      package: true

  package:
    runs-on: ubuntu-24.04
    needs: portable-build
    permissions:
      contents: write        # gh release upload
    defaults:
      run:
        working-directory: boat-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: boat-platform/dist
          merge-multiple: true
      - name: Verify the packages are ours
        # Checked by NAME, not by glob. v0.1.0 shipped c-ares_1.34.5-1_amd64.deb,
        # c-ares-1.34.5-1.src.rpm and an 8.6 GB -Source.tar.gz of the whole
        # working tree, because `ls build/release/*.deb` happily matched a .deb
        # that was not BoAt's. CPACK_PACKAGE_FILE_NAME is pinned, so assert it.
        run: |
          set -eux
          cd dist/packages
          ls -lh

          if ls *-Source.tar.gz >/dev/null 2>&1; then
            echo "::error::a -Source tarball was produced; CPack is misconfigured"
            exit 1
          fi

          # Exactly one of each format per architecture -- named by the
          # architecture, so a package filed under the wrong one fails here.
          for pair in amd64:x86_64 arm64:aarch64; do
            deb_arch=${pair%%:*} machine=${pair#*:}
            test "$(ls -1 boat-platform-*-Linux-${machine}.tar.gz | wc -l)" -eq 1
            test "$(ls -1 boat-platform_*_${deb_arch}.deb         | wc -l)" -eq 1
            test "$(ls -1 boat-platform-*.${machine}.rpm          | wc -l)" -eq 1

            deb=$(ls boat-platform_*_${deb_arch}.deb)
            # The DEB must declare itself as boat-platform at this version, for
            # this architecture. Without dpkg in the build image CPack would
            # otherwise have labelled it i386.
            pkg=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            arch=$(dpkg-deb -f "$deb" Architecture)
            echo "$deb declares: $pkg $ver $arch"
            test "$pkg" = "boat-platform"
            test "$arch" = "$deb_arch"
            case "$ver" in ${GITHUB_REF_NAME#v}*) ;; *) echo "::error::deb version $ver does not match tag ${GITHUB_REF_NAME}"; exit 1 ;; esac

            # And it must actually contain the gateway -- for this architecture.
            rm -rf x && mkdir x && dpkg-deb -x "$deb" x
            ../../packaging/check-portable-binary.sh "$(find x -path '*bin/boat_gateway')" "$machine"

            # Nothing but our own files. v0.1.x shipped 1088 entries -- protobuf,
            # Abseil and upb headers, static libs, CMake configs, .pc files and
            # /usr/bin/protoc, which collides with the distro's protobuf-compiler
            # -- because fetched deps' install rules ran into our install tree.
            stray=$(cd x && find . -type f | grep -vE '^\./usr/(bin/boat_gateway|include/boat/[^/]+\.h|lib/boat/plugins/[^/]+\.(so|schema\.json))$' || true)
            if [ -n "$stray" ]; then
              echo "::error::$deb contains files that are not BoAt's:"; echo "$stray" | head -20
              exit 1
            fi
            rm -rf x
          done

          # A sanity ceiling: the install set is one binary plus five small
          # plugins and a header. Anything near a gigabyte means CPack has swept
          # up the build tree again.
          for f in boat-platform[-_]*; do
            sz=$(stat -c%s "$f")
            echo "$f: $sz bytes"
            test "$sz" -lt 900000000
          done
      - name: Attach the packages to the GitHub release
        # The portable-* workflow artifacts alone sit behind a login and expire
        # with retention. v0.1.0's release had no downloadable packages for that
        # reason.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/packages/boat-platform[-_]* --clobber

  docker-push:
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: boat-platform
    steps:
      - uses: actions/checkout@v4
      # Dockerfile.runtime compiles nothing: it COPYs dist/<TARGETARCH>/boat_gateway.
      # This job used to build one x86-64 binary itself, which buildx then put
      # into the linux/arm64 image too (issue #51).
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: boat-platform/dist
          merge-multiple: true
      - name: Check each binary matches the platform it is filed under
        # Artifacts do not preserve the executable bit.
        run: |
          chmod +x dist/*/boat_gateway
          packaging/check-portable-binary.sh dist/amd64/boat_gateway x86_64 dist/arm64/boat_gateway aarch64
      - name: Compute image name
        # GHCR namespaces follow the GitHub owner, so a hardcoded
        # ghcr.io/boat-platform/... is denied from any other account -- and the
        # registry rejects uppercase, which `github.repository` contains. Derive
        # and lowercase it so this works in whatever namespace the repo lives.
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        # Only for the arm64 stage's `apt-get install ca-certificates`; nothing
        # is compiled under emulation.
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch runtime image
        uses: docker/build-push-action@v5
        with:
          # Dockerfile.runtime lives in boat-platform/ and expects it as context.
          context: boat-platform
          file: boat-platform/Dockerfile.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
