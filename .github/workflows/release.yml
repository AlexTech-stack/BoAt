#
# Relocated from boat-platform/.github/workflows/, where GitHub Actions never
# saw it. Workflows are only discovered at the repository root.
#
# Triggers on a v*.*.* tag. The repository has no tags yet, so this has never
# run -- push the first tag on a throwaway branch and check both jobs before
# tagging a real release.

name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  package:
    runs-on: ubuntu-22.04
    permissions:
      contents: write        # gh release upload
    defaults:
      run:
        working-directory: boat-platform
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        # Not installing cmake from apt: Ubuntu 22.04 ships 3.22 and the presets
        # need 3.24+, so apt would shadow the runner's newer cmake.
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ libacl1-dev rpm
      - name: Verify toolchain versions
        run: |
          cmake --version
          cargo --version
      - name: Configure + build
        run: cmake --preset release && cmake --build --preset release
      - name: Create package
        working-directory: boat-platform/build/release
        run: cpack -G "TGZ;DEB;RPM"
      - name: Verify the packages are ours
        # Checked by NAME, not by glob. v0.1.0 shipped c-ares_1.34.5-1_amd64.deb,
        # c-ares-1.34.5-1.src.rpm and an 8.6 GB -Source.tar.gz of the whole
        # working tree, because `ls build/release/*.deb` happily matched a .deb
        # that was not BoAt's. CPACK_PACKAGE_FILE_NAME is pinned, so assert it.
        run: |
          set -eux
          cd build/release
          ls -lh boat-platform[-_]*.tar.gz boat-platform[-_]*.deb boat-platform[-_]*.rpm

          # Exactly one of each, and nothing calling itself a Source tarball.
          test "$(ls -1 boat-platform[-_]*.tar.gz | wc -l)" -eq 1
          test "$(ls -1 boat-platform[-_]*.deb     | wc -l)" -eq 1
          test "$(ls -1 boat-platform[-_]*.rpm     | wc -l)" -eq 1
          if ls *-Source.tar.gz >/dev/null 2>&1; then
            echo "::error::a -Source tarball was produced; CPack is misconfigured"
            exit 1
          fi

          # The DEB must declare itself as boat-platform at this version.
          pkg=$(dpkg-deb -f boat-platform[-_]*.deb Package)
          ver=$(dpkg-deb -f boat-platform[-_]*.deb Version)
          echo "deb declares: $pkg $ver"
          test "$pkg" = "boat-platform"
          case "$ver" in ${GITHUB_REF_NAME#v}*) ;; *) echo "::error::deb version $ver does not match tag ${GITHUB_REF_NAME}"; exit 1 ;; esac

          # And it must actually contain the gateway.
          dpkg-deb -c boat-platform[-_]*.deb | grep -q 'bin/boat_gateway'

          # A sanity ceiling: the install set is one static binary plus five
          # small plugins and a header. Anything near a gigabyte means CPack has
          # swept up the build tree again.
          for f in boat-platform[-_]*.tar.gz boat-platform[-_]*.deb boat-platform[-_]*.rpm; do
            sz=$(stat -c%s "$f")
            echo "$f: $sz bytes"
            test "$sz" -lt 900000000
          done
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          # upload-artifact paths are relative to the workspace root, not to the
          # job's working-directory.
          path: |
            boat-platform/build/release/boat-platform[-_]*.tar.gz
            boat-platform/build/release/boat-platform[-_]*.deb
            boat-platform/build/release/boat-platform[-_]*.rpm
      - name: Attach the packages to the GitHub release
        # upload-artifact alone leaves them as workflow artifacts: behind a
        # login, expiring with retention, and absent from the release page.
        # v0.1.0's release had no downloadable packages for that reason.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            build/release/boat-platform[-_]*.tar.gz \
            build/release/boat-platform[-_]*.deb \
            build/release/boat-platform[-_]*.rpm \
            --clobber

  docker-push:
    runs-on: ubuntu-22.04
    needs: package
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: boat-platform
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ libacl1-dev
      - name: Configure + build runtime binary
        run: cmake --preset release && cmake --build --preset release --target boat_gateway
      - name: Verify runtime binary exists for Dockerfile
        run: ls build/release/src/gateway/grpc_gateway/boat_gateway
      - name: Compute image name
        # GHCR namespaces follow the GitHub owner, so a hardcoded
        # ghcr.io/boat-platform/... is denied from any other account -- and the
        # registry rejects uppercase, which `github.repository` contains. Derive
        # and lowercase it so this works in whatever namespace the repo lives.
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch runtime image
        uses: docker/build-push-action@v5
        with:
          # Dockerfile.runtime lives in boat-platform/ and expects it as context.
          context: boat-platform
          file: boat-platform/Dockerfile.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
