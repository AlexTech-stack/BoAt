name: Feature request
description: Propose something BoAt should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Worth a look first: `backlog/*.md` tracks known gaps and incident write-ups, often in
        more detail than an issue would. `pdu_gap_analysis.md` and `tcp_plugin_backlog.md` in
        particular already enumerate a lot of missing protocol behaviour.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the feature. What are you testing, and what is stopping you?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like BoAt to do
      description: If you have a shape in mind — a CLI verb, an RPC, a plugin config key — describe it.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How you're working around it now
      description: Often the most useful field. If a workaround exists, the feature is a convenience; if none does, it is a gap.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gateway / core (C++)
        - Plugin or plugin ABI
        - Replay / trace
        - PDU routing / COM signals
        - CAN-TP
        - Python SDK (boat-py)
        - CLI (boat-cli)
        - Web UI (ui/) or tools/
        - admin_gui
        - Build / CMake / CI
        - Documentation
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Does this touch determinism?
      description: |
        BoAt asserts that replay reproduces frame content, ordering and tick attribution
        bit-identically. Anything introducing a wall clock, unseeded randomness or
        nondeterministic ordering into core, scheduling or replay needs a design discussion
        first rather than a patch.
      options:
        - label: As far as I can tell, this needs a clock, randomness, or ordering that isn't tick-derived
          required: false
