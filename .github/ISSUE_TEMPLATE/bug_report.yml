name: Bug report
description: Something behaves differently from how it is documented or intended.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't report security vulnerabilities here — see
        [SECURITY.md](https://github.com/AlexTech-stack/BoAt/blob/master/SECURITY.md).

  - type: textarea
    id: what-you-did
    attributes:
      label: What you did
      description: The exact commands or code, so someone else can run them.
      placeholder: |
        BOAT_CAN_INTERFACES=vcan0 ./build/debug/src/gateway/grpc_gateway/boat_gateway
        boat frame send --bus-type can --iface vcan0 --can-id 0x123 --data AABBCCDD
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: And where that expectation came from, if a doc told you so — a quote or a link is ideal, since the doc may be the thing that's wrong.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Full error output, not a paraphrase. Include the gateway's stderr if it was running.
      render: shell
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`, or the tag you are on."
      placeholder: 618c80b
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Best guess is fine.
      options:
        - Gateway / core (C++)
        - Plugin or plugin ABI
        - Replay / trace
        - PDU routing / COM signals
        - CAN-TP
        - Python SDK (boat-py)
        - CLI (boat-cli)
        - Web UI (ui/) or tools/
        - admin_gui
        - Build / CMake / CI
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        OS and kernel, compiler, CMake and Python versions. If a bus is involved, say whether it
        is virtual (`vcan*`) or physical, and which adapter. `boat config show` output is useful
        — it is designed to be pasted here and carries no hostname or timestamp.
      placeholder: |
        Ubuntu 24.04, kernel 6.8.0-45-generic
        g++ 13.2, CMake 3.28.3, Python 3.11.9
        vcan0 (virtual)
      render: shell
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Workarounds you found, whether it reproduces every time, or a trace file that triggers it.
    validations:
      required: false
