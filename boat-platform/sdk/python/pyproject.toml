[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boat-py"
version = "0.1.1"
description = "Python SDK for BoAt simulation platform"
license = { text = "Apache-2.0" }
authors = [{ name = "Alexander Günther", email = "alexander.guenther@tuta.io" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.81.1",
  "protobuf>=6.31.1",
]

[project.optional-dependencies]
# grpcio-tools is codegen-only (stubs/generate_stubs.sh regenerates the
# committed stubs under boat/stubs/boat/v1/). It used to be a runtime
# dependency, which pulled a protoc toolchain into every install of the SDK.
dev = [
  "pytest>=8.0",
  "pytest-asyncio",
  # Pinned, not `>=`: the stubs under boat/stubs/boat/v1/ are committed, and CI
  # fails the build if regenerating them produces a diff. Different
  # grpcio-tools versions emit different output (the "Protobuf Python Version"
  # header, among other things), so an unpinned generator makes that gate
  # report drift that isn't drift -- which is exactly what it did the first
  # time CI ran. Bump this deliberately, and commit the regenerated stubs in
  # the same change.
  "grpcio-tools==1.83.1",
]
# Reading .asc/.blf CAN traces (boat.trace_analyzer, boat.trace_replay). Both
# guard the import and say to install this extra; .pcap/.pcapng go through
# boat.pcapng, which is pure Python and needs nothing.
trace = [
  "python-can>=4.0.0",
]
# Speeds up boat.trace_reverse_engineer's bit-correlation clustering; a pure-Python
# fallback runs without it, just slower on large traces with many CAN IDs.
analysis = [
  "numpy",
]

[project.urls]
Homepage = "https://github.com/AlexTech-stack/BoAt"
Source = "https://github.com/AlexTech-stack/BoAt"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["boat*"]
