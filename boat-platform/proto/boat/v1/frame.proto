syntax = "proto3";

package boat.v1;

/* ── Metadata per bus type ──────────────────────────────────────────── */

message CanMetadata {
  uint32 can_id  = 1;
  uint32 dlc     = 2;  // Actual payload byte count (0-8 classic CAN; 0-64 CAN FD),
                        // NOT an ISO 11898-1 DLC code. Every sender in this codebase
                        // transmits exactly this many bytes from `payload` -- fewer
                        // bytes than `payload` truncates the frame. For CAN FD,
                        // SocketCanDriver::WriteFrame rounds this up to the nearest
                        // valid wire length (12/16/20/24/32/48/64) and zero-pads the
                        // gap if it isn't already one of those 8 values; it does not
                        // reach further into `payload` to do so, so dlc should
                        // normally just equal payload.size().
  uint32 flags   = 3;  // CANFD_BRS=0x01, CANFD_ESI=0x02, CANFD_FDF=0x04,
                        // BOAT_CAN_FLAG_SELF_SENT=0x08. The registry send path
                        // sets SELF_SENT on every frame the gateway transmits
                        // itself, so a client that both injects into a bus and
                        // subscribes to it can tell its own echo from wire RX.
  uint32 channel = 4;  // 1-based trace channel; 0 = unknown/unset.
                        // Import stores the original channel instead of a
                        // baked interface name, so replay can map it to any
                        // interface via ReplayConfig.buses without re-import.
}

message EthMetadata {
  bytes  dst_mac    = 1;  // exactly 6 bytes
  bytes  src_mac    = 2;  // exactly 6 bytes
  uint32 ethertype  = 3;  // e.g. 0x0800 IPv4, 0x86DD IPv6
  uint32 vlan_id    = 4;  // 0 = untagged
  bytes  src_ip     = 5;  // 4 bytes (v4) or 16 bytes (v6)
  bytes  dst_ip     = 6;  // same
  uint32 ip_version = 7;  // 4 or 6
  uint32 flags      = 8;  // BOAT_ETH_FLAG_SELF_SENT=0x01 — the Ethernet
                          // counterpart of CanMetadata.flags' SELF_SENT bit.
}

message TcpMetadata {
  bytes  src_ip     = 1;  // 4 bytes (v4) or 16 bytes (v6)
  bytes  dst_ip     = 2;  // same
  uint32 ip_version = 3;  // 4 or 6
  uint32 src_port   = 4;
  uint32 dst_port   = 5;
  int32  conn_id    = 6;  // -1 = new, -2 = close, >= 0 = existing
}

message PduMetadata {
  uint32 pdu_id = 1;
}


/* ── Unified Frame ──────────────────────────────────────────────────── */

message Frame {
  enum BusType {
    UNSPECIFIED = 0;
    CAN         = 1;
    CANFD       = 2;
    ETHERNET    = 3;
    TCP         = 4;
    PDU         = 5;
  }

  BusType bus_type     = 1;
  string  iface        = 2;  // interface name
  uint64  timestamp_ns = 3;
  bytes   payload      = 4;

  oneof metadata {
    CanMetadata   can  = 10;
    EthMetadata   eth  = 11;
    TcpMetadata   tcp  = 12;
    PduMetadata   pdu  = 13;
  }
}


/* ── FrameService — unified send/subscribe endpoint ─────────────────── */

message SendFrameRequest  { Frame frame = 1; }
message SendFrameResponse { bool accepted = 1; }

message SubscribeFramesRequest {
  repeated Frame.BusType bus_types = 1;  // empty = all
  string iface_filter = 2;              // empty = all
}

/* One message on the ingress half of StreamFrames.

   A client that bridges an external bus into the gateway sends `subscribe`
   first to configure what it wants back, then streams `frame` messages. The
   subscribe message is optional: omit it to push frames without receiving any.
   Sending it more than once replaces the previous subscription. */
message StreamFramesRequest {
  oneof kind {
    SubscribeFramesRequest subscribe = 1;
    Frame                  frame     = 2;
  }
}

service FrameService {
  rpc SendFrame(SendFrameRequest) returns (SendFrameResponse);
  rpc SubscribeFrames(SubscribeFramesRequest) returns (stream Frame);

  /* Bidirectional frame bridge.

     SendFrame is one round-trip per frame, which cannot keep up with a loaded
     bus; StreamFrames carries ingress and egress over a single connection so a
     remote adapter (e.g. a phone-attached USB CAN interface bridged onto a vcan)
     can run at bus rates.

     Ingress frames go through the same FrameSink as every other producer, so
     they are tagged SELF_SENT and observed by plugins, PDU routing and trace
     recording exactly like locally-generated traffic. An ingress frame naming
     an interface the gateway does not have fails the whole call rather than
     being dropped: the interface is fixed for the life of a bridge session, so
     that is a configuration error and silence would hide it. */
  rpc StreamFrames(stream StreamFramesRequest) returns (stream Frame);
}
