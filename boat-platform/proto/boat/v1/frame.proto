syntax = "proto3";

package boat.v1;

/* ── Metadata per bus type ──────────────────────────────────────────── */

message CanMetadata {
  uint32 can_id  = 1;
  uint32 dlc     = 2;  // Actual payload byte count (0-8 classic CAN; 0-64 CAN FD),
                        // NOT an ISO 11898-1 DLC code. Every sender in this codebase
                        // transmits exactly this many bytes from `payload` -- fewer
                        // bytes than `payload` truncates the frame. For CAN FD,
                        // SocketCanDriver::WriteFrame rounds this up to the nearest
                        // valid wire length (12/16/20/24/32/48/64) and zero-pads the
                        // gap if it isn't already one of those 8 values; it does not
                        // reach further into `payload` to do so, so dlc should
                        // normally just equal payload.size().
  uint32 flags   = 3;  // CANFD_BRS=0x01, CANFD_ESI=0x02, CANFD_FDF=0x04,
                        // BOAT_CAN_FLAG_SELF_SENT=0x08,
                        // BOAT_CAN_FLAG_EXTENDED=0x10. `can_id` is a plain
                        // numeric ID and does *not* encode the 29-bit format
                        // in its magnitude: an extended ID of 0x123 is a
                        // different frame from a standard 0x123 and arbitrates
                        // differently, so the format is this bit. The driver
                        // sets it from CAN_EFF_FLAG on RX and honours it on TX
                        // (falling back to can_id > 0x7FF only when it is
                        // unset, for older producers). Import sets it from the
                        // source file's IDE; replay preserves it.
                        //
                        // SELF_SENT: the registry send path sets it on every
                        // frame the gateway transmits, including frames an
                        // ingress client sent itself through
                        // SendFrame/StreamFrames. It identifies the transmitting
                        // *gateway*, not the originating client: two different
                        // clients' locally-injected frames carry the same bit.
                        // So it distinguishes gateway-transmitted traffic from
                        // wire RX, and a client cannot use it to suppress only
                        // its own echo -- see StreamFrames below.
  uint32 channel = 4;  // 1-based trace channel; 0 = unknown/unset.
                        // Import stores the original channel instead of a
                        // baked interface name, so replay can map it to any
                        // interface via ReplayConfig.buses without re-import.
}

message EthMetadata {
  bytes  dst_mac    = 1;  // exactly 6 bytes
  bytes  src_mac    = 2;  // exactly 6 bytes
  uint32 ethertype  = 3;  // e.g. 0x0800 IPv4, 0x86DD IPv6
  uint32 vlan_id    = 4;  // 0 = untagged
  bytes  src_ip     = 5;  // 4 bytes (v4) or 16 bytes (v6)
  bytes  dst_ip     = 6;  // same
  uint32 ip_version = 7;  // 4 or 6
  uint32 flags      = 8;  // BOAT_ETH_FLAG_SELF_SENT=0x01 — the Ethernet
                          // counterpart of CanMetadata.flags' SELF_SENT bit,
                          // with the same process-scoped (not client-scoped)
                          // meaning.
}

message TcpMetadata {
  bytes  src_ip     = 1;  // 4 bytes (v4) or 16 bytes (v6)
  bytes  dst_ip     = 2;  // same
  uint32 ip_version = 3;  // 4 or 6
  uint32 src_port   = 4;
  uint32 dst_port   = 5;
  int32  conn_id    = 6;  // -1 = new, -2 = close, >= 0 = existing
}

message PduMetadata {
  uint32 pdu_id = 1;
}


/* ── Unified Frame ──────────────────────────────────────────────────── */

message Frame {
  enum BusType {
    UNSPECIFIED = 0;
    CAN         = 1;
    CANFD       = 2;
    ETHERNET    = 3;
    TCP         = 4;
    PDU         = 5;
  }

  BusType bus_type     = 1;
  string  iface        = 2;  // interface name
  uint64  timestamp_ns = 3;
  bytes   payload      = 4;

  oneof metadata {
    CanMetadata   can  = 10;
    EthMetadata   eth  = 11;
    TcpMetadata   tcp  = 12;
    PduMetadata   pdu  = 13;
  }
}


/* ── FrameService — unified send/subscribe endpoint ─────────────────── */

message SendFrameRequest  { Frame frame = 1; }
message SendFrameResponse { bool accepted = 1; }

message SubscribeFramesRequest {
  repeated Frame.BusType bus_types = 1;  // empty = all
  string iface_filter = 2;              // empty = all
}

/* One interface the gateway has open, on either bus.

   Supersedes CanService.ListBuses and EthernetService.ListInterfaces. The CAN
   metadata fields come straight from CanBusInfo; Ethernet entries carry only
   `iface` and `bus_type`, since ListEthernetInterfacesResponse never had more
   than a name and the Ethernet registry holds no equivalent metadata. Read
   `bus_type` before the rest -- an empty `driver` on an ETHERNET entry means
   "not applicable", not "unknown". */
message InterfaceInfo {
  string        iface      = 1;  // interface name, e.g. "can0", "vcan0", "eth0"
  Frame.BusType bus_type   = 2;  // CAN or ETHERNET
  string        driver     = 3;  // CAN only: kernel driver, e.g. "peak_usb", "vcan"
  string        state      = 4;  // CAN only: "up", "down", "unknown"
  bool          fd_support = 5;  // CAN only: CAN FD capable (mtu >= 72)
  uint32        bitrate    = 6;  // CAN only: nominal bitrate in bit/s, 0 if unknown
}

message ListInterfacesRequest {
  repeated Frame.BusType bus_types = 1;  // empty = all
}

message ListInterfacesResponse { repeated InterfaceInfo interfaces = 1; }

/* One message on the ingress half of StreamFrames.

   A client that bridges an external bus into the gateway sends `subscribe`
   first to configure what it wants back, then streams `frame` messages. The
   subscribe message is optional: omit it to push frames without receiving any.
   Sending it more than once replaces the previous subscription. */
message StreamFramesRequest {
  oneof kind {
    SubscribeFramesRequest subscribe = 1;
    Frame                  frame     = 2;
  }
}

service FrameService {
  rpc SendFrame(SendFrameRequest) returns (SendFrameResponse);

  /* Stream frames off the gateway.

     An `iface_filter` naming an interface neither registry has fails with
     NOT_FOUND rather than returning an empty stream, matching SendFrame. A
     typo'd interface is a configuration error, and a subscription that
     silently never yields is indistinguishable from a quiet bus.

     Backpressure: each subscriber has a bounded backlog
     (BOAT_STREAM_QUEUE_CAPACITY, default 4096 events). A client that cannot
     keep up loses the oldest frames -- the gateway stays live and flat rather
     than buffering for it -- and the cumulative count is reported as the
     `grpc.frames.subscribe.dropped` point by MetricsService. A rising count
     means gaps in what this stream delivered. */
  rpc SubscribeFrames(SubscribeFramesRequest) returns (stream Frame);

  /* Every CAN and Ethernet interface the gateway has open. */
  rpc ListInterfaces(ListInterfacesRequest) returns (ListInterfacesResponse);

  /* Bidirectional frame bridge.

     SendFrame is one round-trip per frame, which cannot keep up with a loaded
     bus; StreamFrames carries ingress and egress over a single connection so a
     remote adapter (e.g. a phone-attached USB CAN interface bridged onto a vcan)
     can run at bus rates.

     Ingress frames go through the same FrameSink as every other producer, so
     they are tagged SELF_SENT and observed by plugins, PDU routing and trace
     recording exactly like locally-generated traffic. SELF_SENT marks the
     gateway as the transmitter (see CanMetadata.flags); it does **not**
     identify which client originated a frame, so a bridge must not treat it
     as "my frame" -- frames it injected and frames another client injected
     come back identically tagged. An ingress frame naming
     an interface the gateway does not have fails the whole call rather than
     being dropped: the interface is fixed for the life of a bridge session, so
     that is a configuration error and silence would hide it.

     Backpressure matches SubscribeFrames: bounded backlog per subscriber,
     oldest frames dropped, cumulative count as `grpc.frames.stream.dropped`
     via MetricsService. */
  rpc StreamFrames(stream StreamFramesRequest) returns (stream Frame);
}
