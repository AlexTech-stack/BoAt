syntax = "proto3";

package boat.v1;

// Mirrors CanTpConfig from sdk/cpp/include/boat/can_tp.h (ISO 15765-2).
// A connection is identified by nsdu_id and represents one session between
// source_addr (this node) and target_addr (peer node), both required: we
// send FF/CF and receive FC on source_addr; we receive SF/FF/CF and send FC
// on target_addr. A single-ID session (one CAN ID for both directions) is
// expressed by passing the same value for both -- there is no implicit
// fallback to nsdu_id.
// Mirrors CanTpAddressingMode in boat/can_tp.h. 11-bit vs. 29-bit CAN ID is
// *not* part of this enum -- it's just a property of the numeric value
// passed as source_addr/target_addr (any value > 0x7FF gets CAN_EFF_FLAG
// automatically). Conventional 29-bit "Normal Fixed" (0x18DA<TA><SA> /
// 0x18DB<TA><SA>) and "Mixed 29-bit" (0x18CE<TA><SA> / 0x18CD<TA><SA>) IDs
// are formed by the caller and passed as source_addr/target_addr like any
// other CAN ID -- this plugin treats them as opaque throughout.
enum CanTpAddressingMode {
  CANTP_ADDR_NORMAL   = 0;  // no address byte; source_addr/target_addr are the literal CAN IDs
  CANTP_ADDR_EXTENDED = 1;  // first payload byte = N_TA (target address)
  CANTP_ADDR_MIXED    = 2;  // first payload byte = N_AE (address extension) -- wire-identical to EXTENDED
}

message CanTpConfig {
  uint32 nsdu_id             = 1;  // logical session identifier
  uint32 source_addr         = 2;  // CAN ID of this node (required, non-zero)
  uint32 target_addr         = 3;  // CAN ID of the peer node (required, non-zero)
  uint32 rx_buffer_size      = 4;  // max reassembly buffer (default 4095 if 0)
  uint32 block_size          = 5;  // BS to advertise in sent FC (0 = unlimited); truncated to uint8 server-side
  uint32 st_min              = 6;  // STmin to advertise in sent FC; truncated to uint8 server-side
  uint32 can_dlc             = 7;  // max CAN DLC for this connection — must be 8 or 64
  bool   extended_addressing = 8;  // DEPRECATED alias for addressing_mode = CANTP_ADDR_EXTENDED; only takes effect when addressing_mode is left at CANTP_ADDR_NORMAL. New callers should set addressing_mode directly.
  uint32 n_bs_ms              = 9;   // ISO 15765-2 N_Bs: max time TX waits for FC before aborting (0 = ISO default, 1000ms)
  uint32 n_cr_ms              = 10;  // ISO 15765-2 N_Cr: max time RX waits for the next CF before aborting (0 = ISO default, 1000ms)
  bool   brs                  = 11;  // CAN FD Bit Rate Switch for this connection's frames; only meaningful when can_dlc > 8, not forced on automatically
  uint32 pad_byte             = 12;  // fill byte for unused trailing data bytes (0 = ISO/AUTOSAR default, 0xCC); truncated to uint8 server-side. Note: 0 is the "use default" sentinel, so literal 0x00 padding isn't independently selectable through this field.
  CanTpAddressingMode addressing_mode = 13;  // authoritative addressing mode; see CanTpAddressingMode
  uint32 address_byte         = 14;  // this connection's N_TA/N_AE (only meaningful for EXTENDED/MIXED); 0 = derive from target_addr & 0xFF (today's historical behavior). Setting this explicitly is what lets multiple connections share one target_addr, disambiguated by this byte. Truncated to uint8 server-side.
}

message ConfigureRequest {
  CanTpConfig config = 1;
  // Which loaded CanTp instance to target, when more than one is loaded
  // (e.g. one per CAN interface). "" selects the only loaded instance if
  // there is exactly one; if there are several, the RPC fails with
  // FAILED_PRECONDITION asking the caller to disambiguate.
  string iface = 2;
}

message ConfigureResponse {
  bool   ok    = 1;
  string iface = 2;  // the CanTp plugin's actual bound iface (from its load-time
                      // config), for optional client-side --iface validation
}

// Outcome of a Send() call. Distinguishes an immediate single-frame send from
// an asynchronously-initiated multi-frame transfer (paced by the plugin's
// internal TX thread) — the two map to can_tp_send()'s 1 / 0 return values.
enum SendResult {
  SEND_RESULT_UNSPECIFIED           = 0;
  SEND_RESULT_SINGLE_FRAME          = 1;
  SEND_RESULT_MULTI_FRAME_INITIATED = 2;
}

message SendRequest {
  uint32 nsdu_id = 1;
  bytes  data    = 2;
  // See ConfigureRequest.iface -- selects which loaded instance to target.
  string iface   = 3;
}

message SendResponse {
  SendResult result = 1;
}

// One configured N-SDU connection, as reported by ListSessions.
message CanTpSession {
  string iface               = 1;  // which loaded instance this session belongs to
  uint32 nsdu_id              = 2;
  uint32 source_addr          = 3;
  uint32 target_addr          = 4;
  uint32 rx_buffer_size       = 5;
  uint32 block_size           = 6;
  uint32 st_min               = 7;
  uint32 can_dlc              = 8;
  bool   extended_addressing  = 9;
  string rx_state             = 10;  // "IDLE" | "WAIT_CF"
  string tx_state             = 11;  // "IDLE" | "WAIT_FC" | "SEND_CF" | "COMPLETE"
  uint32 n_bs_ms               = 12;  // effective N_Bs (already resolved from the 0-sentinel)
  uint32 n_cr_ms               = 13;  // effective N_Cr (already resolved from the 0-sentinel)
  bool   brs                   = 14;
  uint32 pad_byte              = 15;
  CanTpAddressingMode addressing_mode = 16;
  uint32 address_byte          = 17;  // effective N_TA/N_AE (already resolved from the 0-sentinel); meaningless for CANTP_ADDR_NORMAL
}

message ListSessionsRequest {
  // "" lists sessions across every loaded CanTp instance (each tagged with
  // its iface in the response); set to scope to just one instance.
  string iface = 1;
}

message ListSessionsResponse {
  repeated CanTpSession sessions = 1;
}

message RemoveSessionRequest {
  uint32 nsdu_id = 1;
  // See ConfigureRequest.iface -- selects which loaded instance to target.
  string iface   = 2;
}

message RemoveSessionResponse {
  bool ok = 1;
}

message SubscribeRequest {
  // Which nsdu_ids to stream decoded RX payloads for; empty = every session
  // on the targeted instance(s).
  repeated uint32 nsdu_ids = 1;
  // "" streams across every loaded CanTp instance (each event tagged with
  // its iface); set to scope to just one instance.
  string iface = 2;
}

// One decoded RX payload: a completed Single Frame, or a fully-reassembled
// multi-frame (FF+CF...) transfer -- CanTpService's counterpart to
// PduService.SubscribePdus, sourced directly from the plugin rather than
// the generic PDU bus.
message CanTpRxEvent {
  string iface        = 1;
  uint32 nsdu_id       = 2;
  bytes  data          = 3;
  uint64 timestamp_ns  = 4;
}

// Exposes the CanTp plugin's live gateway-side instance(s) (loaded via
// BOAT_NODE_PLUGINS, one per CAN interface) to CLI/SDK clients.
// See PluginManager::FindService("can_tp:" + iface).
service CanTpService {
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  rpc Send(SendRequest) returns (SendResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RemoveSession(RemoveSessionRequest) returns (RemoveSessionResponse);
  rpc Subscribe(SubscribeRequest) returns (stream CanTpRxEvent);
}
